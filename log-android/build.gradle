// log-android 模块构建脚本
// Android 平台适配（Room + Logcat）

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// 生成目录随 buildDir 隔离；Sync 将根 MIT 文本作为声明式任务输入。
def licenseResources = layout.buildDirectory.dir('generated/license-resources')
def prepareLicenseResources = tasks.register('prepareLicenseResources', Sync) {
    from(rootProject.file('LICENSE')) {
        into 'META-INF/log-record/log-android'
    }
    into licenseResources
}

android {
    namespace 'com.atian10.logrecord.android'
    compileSdk 33

    // Java 资源进入 AAR 的 classes.jar，使许可随消费方一起分发。
    sourceSets.main.resources.srcDir licenseResources

    defaultConfig {
        minSdk 21
        targetSdk 33

        // 验证时写入独立目录；普通构建继续使用已有 schema 目录。
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": (project.findProperty('roomSchemaDir') ?: "$projectDir/schemas").toString()]
            }
        }

        // 消费方 ProGuard 规则自动传递
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 仅提供 Release 库制品，两个示例模块不进入发布集合。
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    // 纯代码库，关闭非必要构建特性以加速构建
    buildFeatures {
        buildConfig false
        resValues false
    }
}

// AGP 7.4 的各变体先准备 Java 资源，再由其标准任务打包，普通 AS 构建同样生效。
tasks.matching { it.name ==~ /process.*JavaRes/ }.configureEach {
    dependsOn prepareLicenseResources
}
// AGP 的源码 JAR 独立于 Java 资源处理，需显式携带相同根许可证。
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF/log-record/log-android'
    }
}

// AGP 7.4 在配置完成后提供 Release 组件，由组件生成完整依赖元数据。
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                pom {
                    name = 'log-record Android'
                    description = 'Android API 21+ logging adapter using Room, built with Java 11.'
                    url = 'https://github.com/Atian10/log-record'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/license/mit'
                            distribution = 'repo'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/Atian10/log-record.git'
                        url = 'https://github.com/Atian10/log-record'
                    }
                }
            }
        }
    }
}

dependencies {
    // 依赖核心模块
    api project(':log-core')

    // Room 数据库
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    // 将标准库版本对齐传递给独立消费方，避免 stdlib 1.8.0 与旧 jdk7/jdk8 重复类。
    // 沿用示例已有的 1.8.0 基线，不增加 Kotlin 编译插件或变更 AGP/JDK。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')

    // AndroidX 注解
    implementation 'androidx.annotation:annotation:1.6.0'
}
